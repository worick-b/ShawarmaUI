name: Build ShawarmaUI Android Demo

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools build-tools;34.0.0 platforms;android-34 ndk;26.3.11579264

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Garantir AndroidManifest.xml valido
        working-directory: examples/android_demo
        run: |
          mkdir -p app/src/main
          python3 -c '
          import textwrap
          ns = bytes.fromhex("687474703a2f2f736368656d61732e616e64726f69642e636f6d2f61706b2f7265732f616e64726f6964").decode()
          xml = textwrap.dedent(f"""\
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="{ns}">
              <uses-feature android:glEsVersion="0x00030000" android:required="true" />
              <application
                  android:label="ShawarmaUI Demo"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          """)
          open("app/src/main/AndroidManifest.xml", "w").write(xml)
          '

      - name: Build Debug APK
        working-directory: examples/android_demo
        run: gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShawarmaUI-Demo-APK
          path: examples/android_demo/app/build/outputs/apk/debug/*.apk
