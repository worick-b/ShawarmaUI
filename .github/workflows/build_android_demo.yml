name: Build Android Demo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android Demo APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate AndroidManifest.xml
        working-directory: examples/android
        run: |
          python3 -c '
          import os, textwrap
          os.makedirs("app/src/main", exist_ok=True)
          ns = bytes.fromhex("687474703a2f2f736368656d61732e616e64726f69642e636f6d2f61706b2f7265732f616e64726f6964").decode()
          xml = textwrap.dedent(f"""\
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="{ns}">
              <uses-feature android:glEsVersion="0x00030000" android:required="true" />
              <application
                  android:allowBackup="false"
                  android:label="ShawarmaUI Demo"
                  android:hardwareAccelerated="true"
                  android:extractNativeLibs="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize"
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          """)
          open("app/src/main/AndroidManifest.xml", "w").write(xml)
          '

      - name: Build APK
        working-directory: examples/android
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../ShawarmaUI_Android.apk

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: ShawarmaUI Demos (Windows & Android)
          files: ShawarmaUI_Android.apk
