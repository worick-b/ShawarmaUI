name: Build Android Demo

on:
  push:
    branches: [ main ]
    paths:
      - 'include/ShawarmaUI_Android.h'
      - 'include/ShawarmaIcons.h'
      - 'examples/android_demo/**'
      - 'third_party/nanovg/**'
      - '.github/workflows/build-android_demo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android Demo APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: examples/android_demo
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../ShawarmaUI_Android.apk

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: ShawarmaUI Demos (Windows & Android)
          files: ShawarmaUI_Android.apk
