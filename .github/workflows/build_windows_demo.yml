name: Build Windows Demo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MinGW-w64
        shell: pwsh
        run: |
          if (Test-Path "C:\msys64\mingw64\bin") {
            "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Build Hybrid Direct2D & GDI
        shell: cmd
        run: |
          g++ -Os -pipe -fno-math-errno -fno-trapping-math -fno-rtti -ffunction-sections -fdata-sections -Wall -Wextra -Wno-unused-function -Wno-attributes -Wno-cast-function-type -Wno-ignored-qualifiers -s -std=c++17 -Iinclude examples/windows/ShawarmaUI_Demo.cpp -o ShawarmaUI_Demo.exe -Wl,--gc-sections -lgdi32 -lmsimg32 -ldwmapi -lshell32 -ladvapi32 -mwindows -static
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Demos (Windows & Android)
          files: |
            ShawarmaUI_Demo.exe
