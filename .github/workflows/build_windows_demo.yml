name: Build ShawarmaUI Showcases

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (GDI & Direct2D)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MinGW-w64 (w64devkit)
        uses: egraphs-good/setup-mingw@v2
        with:
          platform: x64

      - name: Compile Win32 GDI Showcase
        shell: pwsh
        run: |
          g++ -Os -pipe -fno-math-errno -fno-trapping-math -fno-rtti `
              -ffunction-sections -fdata-sections -Wall -Wextra `
              -Wno-unused-function -Wno-attributes -Wno-cast-function-type -Wno-ignored-qualifiers `
              -s -std=c++17 main_gdi.cpp -o ShawarmaUI_GDI.exe `
              -Wl,--gc-sections -lgdi32 -lmsimg32 -ldwmapi -lshell32 -ladvapi32 -mwindows -static

      - name: Compile Direct2D Showcase
        shell: pwsh
        run: |
          g++ -Os -pipe -fno-math-errno -fno-trapping-math -fno-rtti `
              -ffunction-sections -fdata-sections -Wall -Wextra `
              -Wno-unused-function -Wno-attributes -Wno-cast-function-type -Wno-ignored-qualifiers `
              -s -std=c++17 main_d2d.cpp -o ShawarmaUI_D2D.exe `
              -Wl,--gc-sections -ld2d1 -ldwrite -luuid -ldwmapi -lshell32 -ladvapi32 -mwindows -static

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ShawarmaUI-Windows-x64
          path: |
            ShawarmaUI_GDI.exe
            ShawarmaUI_D2D.exe

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ShawarmaUI_GDI.exe
            ShawarmaUI_D2D.exe
          generate_release_notes: true
